name: GoProSpatialMaker
options:
  bundleIdPrefix: com.inai17ibar
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  GoProSpatialMaker:
    type: application
    platform: macOS
    sources:
      - path: Sources/GoProSpatialMaker
    info:
      path: Sources/GoProSpatialMaker/Info.plist
      properties:
        CFBundleName: GoPro Spatial Maker
        CFBundleDisplayName: GoPro Spatial Maker
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
    entitlements:
      path: Sources/GoProSpatialMaker/GoProSpatialMaker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.GoProSpatialMaker
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
  GoProSpatialMakerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GoProSpatialMakerTests
    dependencies:
      - target: GoProSpatialMaker
